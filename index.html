<!DOCTYPE html>
<html>

<head>
    <title>Circle Area Calculator + Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #0066cc;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            transform: scale(1.05);
        }

        #result {
            font-size: 24px;
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }

        #calcResult {
            font-size: 22px;
            margin-top: 15px;
            color: purple;
            font-weight: bold;
        }

        .box {
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <h1>Circle Area Calculator</h1>

    <input type="number" id="radius" placeholder="Enter Radius">

    <button onclick="calculateCircle()">Calculate Area</button>

    <p id="result"></p>

    <div class="box">
        <h1>Simple Calculator</h1>

        <input type="number" id="num1" placeholder="First Number">
        <input type="number" id="num2" placeholder="Second Number">

        <br>

        <button onclick="add()">+</button>
        <button onclick="sub()">-</button>
        <button onclick="mul()">*</button>
        <button onclick="div()">/</button>

        <p id="calcResult"></p>
    </div>

    <script>
        function calculateCircle() {
            let r = Number(document.getElementById("radius").value);
            let area = Math.PI * r * r;

            document.getElementById("result").innerHTML =
                "Area = " + area.toFixed(2);
        }

        function getValues() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            return [a, b];
        }

        function add() {
            let [a, b] = getValues();
            document.getElementById("calcResult").innerHTML = a + b;
        }

        function sub() {
            let [a, b] = getValues();
            document.getElementById("calcResult").innerHTML = a - b;
        }

        function mul() {
            let [a, b] = getValues();
            document.getElementById("calcResult").innerHTML = a * b;
        }

        function div() {
            let [a, b] = getValues();
            document.getElementById("calcResult").innerHTML = a / b;
        }
    </script>

</body>
</html>
