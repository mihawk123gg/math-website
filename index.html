<!DOCTYPE html>
<html>

<head>
    <title>Circle Area Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #0066cc;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
        }

        button:hover {
            transform: scale(1.05);
        }

        #result {
            font-size: 24px;
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h1>Circle Area Calculator</h1>

    <input type="number" id="radius" placeholder="Enter Radius">

    <button onclick="calculate()">
        Calculate
    </button>

    <p id="result"></p>

    <script>
        function calculate() {

            let r = Number(document.getElementById("radius").value);

            let area = 3.14159 * r * r;

            document.getElementById("result").innerHTML =
                "Area = " + area.toFixed(2);

        }
    </script>

</body>

</html>
